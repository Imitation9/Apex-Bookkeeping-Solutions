        <path
          d="M306 432C340 420 352 378 386 390C420 402 430 340 466 354C502 368 516 312 550 327C580 340 594 296 610 306"
          stroke="#D8B45A"
          stroke-width="4"
          stroke-linecap="round"
        />

        <path
          d="M306 442C338 434 358 412 386 419C420 427 436 393 466 404C500 417 520 376 550 389C580 402 594 366 610 371"
          stroke="#73889B"
          stroke-width="3"
          stroke-linecap="round"
          stroke-dasharray="6 7"
        />

        <g fill="#718096" font-size="9" font-family="Arial, sans-serif">
          <text x="302" y="474">JAN</text>
          <text x="360" y="474">FEB</text>
          <text x="418" y="474">MAR</text>
          <text x="476" y="474">APR</text>
          <text x="534" y="474">MAY</text>
          <text x="590" y="474">JUN</text>
        </g>
      </g>

      <!-- Side details -->

      <g filter="url(#cardShadow)">
        <rect x="650" y="266" width="188" height="220" rx="20" fill="white" />

        <text x="672" y="298" fill="#19334B" font-size="14" font-weight="700" font-family="Arial, sans-serif">
          Fund Tracking
        </text>

        <text x="672" y="333" fill="#718096" font-size="10" font-family="Arial, sans-serif">
          General operations
        </text>
        <text x="794" y="333" fill="#19334B" font-size="10" font-weight="700" text-anchor="end" font-family="Arial, sans-serif">
          74%
        </text>
        <rect x="672" y="342" width="144" height="7" rx="3.5" fill="#E7EDF2" />
        <rect x="672" y="342" width="107" height="7" rx="3.5" fill="#D8B45A" />

        <text x="672" y="380" fill="#718096" font-size="10" font-family="Arial, sans-serif">
          Program services
        </text>
        <text x="794" y="380" fill="#19334B" font-size="10" font-weight="700" text-anchor="end" font-family="Arial, sans-serif">
          62%
        </text>
        <rect x="672" y="389" width="144" height="7" rx="3.5" fill="#E7EDF2" />
        <rect x="672" y="389" width="89" height="7" rx="3.5" fill="#58758E" />

        <text x="672" y="427" fill="#718096" font-size="10" font-family="Arial, sans-serif">
          Restricted grants
        </text>
        <text x="794" y="427" fill="#19334B" font-size="10" font-weight="700" text-anchor="end" font-family="Arial, sans-serif">
          48%
        </text>
        <rect x="672" y="436" width="144" height="7" rx="3.5" fill="#E7EDF2" />
        <rect x="672" y="436" width="69" height="7" rx="3.5" fill="#9CAFC0" />
      </g>

      <!-- Bottom cards -->

      <g filter="url(#cardShadow)">
        <rect x="278" y="504" width="174" height="118" rx="20" fill="white" />

        <circle cx="308" cy="535" r="14" fill="#EEF3F7" />
        <path d="M301 535H315M308 528V542" stroke="#203A5A" stroke-width="2" stroke-linecap="round" />

        <text x="332" y="532" fill="#19334B" font-size="12" font-weight="700" font-family="Arial, sans-serif">
          Payroll
        </text>
        <text x="332" y="548" fill="#718096" font-size="9" font-family="Arial, sans-serif">
          Ready for processing
        </text>

        <text x="298" y="585" fill="#19334B" font-size="20" font-weight="700" font-family="Arial, sans-serif">
          On Schedule
        </text>
        <circle cx="424" cy="579" r="5" fill="#39816E" />
      </g>

      <g filter="url(#cardShadow)">
        <rect x="468" y="504" width="174" height="118" rx="20" fill="white" />

        <circle cx="498" cy="535" r="14" fill="#FFF7E7" />
        <path d="M492 538L497 533L501 536L507 528" stroke="#B88A2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

        <text x="522" y="532" fill="#19334B" font-size="12" font-weight="700" font-family="Arial, sans-serif">
          Reporting
        </text>
        <text x="522" y="548" fill="#718096" font-size="9" font-family="Arial, sans-serif">
          Monthly package
        </text>

        <text x="488" y="585" fill="#19334B" font-size="20" font-weight="700" font-family="Arial, sans-serif">
          Prepared
        </text>
        <circle cx="614" cy="579" r="5" fill="#D8B45A" />
      </g>

      <g filter="url(#cardShadow)">
        <rect x="658" y="504" width="180" height="118" rx="20" fill="white" />

        <circle cx="688" cy="535" r="14" fill="#EDF7F3" />
        <path d="M681 535L686 540L696 529" stroke="#39816E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

        <text x="712" y="532" fill="#19334B" font-size="12" font-weight="700" font-family="Arial, sans-serif">
          Books
        </text>
        <text x="712" y="548" fill="#718096" font-size="9" font-family="Arial, sans-serif">
          Review completed
        </text>

        <text x="678" y="585" fill="#19334B" font-size="20" font-weight="700" font-family="Arial, sans-serif">
          Current
        </text>
        <circle cx="810" cy="579" r="5" fill="#39816E" />
      </g>
    </g>
  </g>
</svg>
