        </text>
        <circle cx="680" cy="210" r="16" fill="#E9F5F0" />
        <path d="M672 210L678 216L689 203" stroke="#39816E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <text x="708" y="206" fill="#19334B" font-size="13" font-weight="700" font-family="Arial, sans-serif">
