      </text>

      <text
        x="278"
        y="91"
        fill="#19334B"
        font-size="23"
        font-weight="700"
        font-family="Arial, sans-serif"
      >
        Financial Overview
      </text>

      <text
        x="278"
        y="116"
        fill="#718096"
        font-size="12"
        font-family="Arial, sans-serif"
      >
        Clear financial information for confident decisions
      </text>

      <rect
        x="750"
        y="74"
        width="88"
        height="34"
        rx="17"
        fill="#FFFFFF"
      />

      <circle cx="771" cy="91" r="7" fill="#D8B45A" />

      <text
        x="786"
        y="95"
        fill="#41566A"
        font-size="10"
        font-weight="700"
        font-family="Arial, sans-serif"
      >
        CURRENT
      </text>

      <!-- Summary cards -->

      <g filter="url(#cardShadow)">
        <rect x="278" y="146" width="166" height="102" rx="18" fill="white" />
        <text x="298" y="174" fill="#718096" font-size="11" font-family="Arial, sans-serif">
          OPERATING BALANCE
        </text>
        <text x="298" y="210" fill="#19334B" font-size="24" font-weight="700" font-family="Arial, sans-serif">
          $84,250
        </text>
        <text x="298" y="231" fill="#39816E" font-size="10" font-weight="700" font-family="Arial, sans-serif">
          ↑ HEALTHY POSITION
        </text>
      </g>

      <g filter="url(#cardShadow)">
        <rect x="460" y="146" width="166" height="102" rx="18" fill="white" />
        <text x="480" y="174" fill="#718096" font-size="11" font-family="Arial, sans-serif">
