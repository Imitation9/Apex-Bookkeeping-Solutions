<svg
  width="920"
  height="720"
  viewBox="0 0 920 720"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="dashboardTitle dashboardDescription"
>
  <title id="dashboardTitle">Apex financial dashboard illustration</title>
  <desc id="dashboardDescription">
    A fictional financial dashboard showing reporting, reconciliation,
    budgeting, payroll, and grant tracking.
  </desc>

  <defs>
    <linearGradient id="background" x1="80" y1="30" x2="840" y2="690">
      <stop stop-color="#F8FAFC" />
      <stop offset="1" stop-color="#E8EEF4" />
    </linearGradient>

    <linearGradient id="navyGradient" x1="96" y1="82" x2="250" y2="622">
      <stop stop-color="#203A5A" />
      <stop offset="1" stop-color="#122B40" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E6BD63" />
      <stop offset="1" stop-color="#B88A2E" />
    </linearGradient>

    <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#D8B45A" stop-opacity=".35" />
      <stop offset="1" stop-color="#D8B45A" stop-opacity="0" />
    </linearGradient>

    <filter
      id="shadow"
      x="0"
      y="0"
      width="920"
      height="720"
      filterUnits="userSpaceOnUse"
    >
      <feDropShadow
        dx="0"
        dy="24"
        stdDeviation="24"
        flood-color="#0F2538"
        flood-opacity=".18"
      />
    </filter>

    <filter
      id="cardShadow"
      x="-20%"
      y="-20%"
      width="140%"
      height="160%"
    >
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="10"
        flood-color="#152F48"
        flood-opacity=".08"
      />
    </filter>

    <clipPath id="dashboardClip">
      <rect x="54" y="42" width="812" height="630" rx="30" />
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect
      x="54"
      y="42"
      width="812"
      height="630"
      rx="30"
      fill="url(#background)"
    />

    <g clip-path="url(#dashboardClip)">
      <rect
        x="54"
        y="42"
        width="196"
        height="630"
        fill="url(#navyGradient)"
      />

      <circle cx="92" cy="88" r="18" fill="url(#goldGradient)" />
      <path
        d="M84 96L92 78L100 96H96L92 87L88 96H84Z"
        fill="#163047"
      />

      <text
        x="122"
        y="94"
        fill="white"
        font-size="22"
        font-weight="700"
        font-family="Arial, sans-serif"
        letter-spacing="1"
      >
        APEX
      </text>

      <text
        x="84"
        y="144"
        fill="#9FB0C0"
        font-size="10"
        font-weight="700"
        font-family="Arial, sans-serif"
        letter-spacing="1.5"
      >
        FINANCIAL OVERVIEW
      </text>

      <g font-family="Arial, sans-serif" font-size="13">
        <rect x="72" y="166" width="160" height="44" rx="12" fill="#FFFFFF" fill-opacity=".10" />
        <circle cx="94" cy="188" r="7" fill="#D8B45A" />
        <text x="114" y="193" fill="white" font-weight="700">Dashboard</text>

        <circle cx="94" cy="240" r="6" stroke="#8EA1B3" stroke-width="2" />
        <text x="114" y="245" fill="#B7C4CF">Transactions</text>

        <rect x="88" y="286" width="12" height="10" rx="2" stroke="#8EA1B3" stroke-width="2" />
        <text x="114" y="296" fill="#B7C4CF">Reports</text>

        <path d="M88 342H100M94 336V348" stroke="#8EA1B3" stroke-width="2" stroke-linecap="round" />
        <text x="114" y="347" fill="#B7C4CF">Payroll</text>

        <path d="M88 395H100V407H88V395Z" stroke="#8EA1B3" stroke-width="2" />
        <path d="M91 399H97M91 403H97" stroke="#8EA1B3" stroke-width="1.5" />
        <text x="114" y="405" fill="#B7C4CF">Grant Tracking</text>
      </g>

      <rect
        x="72"
        y="555"
        width="160"
        height="88"
        rx="18"
        fill="#FFFFFF"
        fill-opacity=".08"
      />

      <circle cx="96" cy="583" r="10" fill="#D8B45A" />
      <path d="M92 583L95 586L101 579" stroke="#163047" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <text
        x="114"
        y="579"
        fill="white"
        font-size="12"
        font-weight="700"
        font-family="Arial, sans-serif"
