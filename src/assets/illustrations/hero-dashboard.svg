        </text>
        <text x="480" y="210" fill="#19334B" font-size="24" font-weight="700" font-family="Arial, sans-serif">
          68%
        </text>
        <rect x="480" y="224" width="122" height="7" rx="3.5" fill="#E7EDF2" />
        <rect x="480" y="224" width="83" height="7" rx="3.5" fill="url(#goldGradient)" />
      </g>

      <g filter="url(#cardShadow)">
